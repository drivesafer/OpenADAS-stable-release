<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Video + GPX Inspector</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family:
        Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #0b0d10;
      color: #f5f7fa;
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    #app {
      display: grid;
      grid-template-columns: 300px 1fr;
      width: 100vw;
      height: 100vh;
    }

    /* =========================
       SIDEBAR
    ========================= */

    #sidebar {
      background: #111419;
      border-right: 1px solid #2b3038;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .sidebarHeader {
      padding: 18px;
      border-bottom: 1px solid #2b3038;
    }

    .sidebarHeader h1 {
      font-size: 17px;
      margin: 0 0 5px;
    }

    .sidebarHeader p {
      color: #939ba8;
      font-size: 12px;
      line-height: 1.5;
      margin: 0;
    }

    #folderButton {
      margin-top: 14px;
      width: 100%;
      border: 0;
      background: #ffffff;
      color: #111;
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #folderButton:hover {
      background: #e9edf2;
    }

    #folderInput {
      display: none;
    }

    #folderStats {
      font-size: 11px;
      color: #7f8996;
      margin-top: 10px;
      line-height: 1.5;
    }

    #fileList {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .fileItem {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: 0.12s;
    }

    .fileItem:hover {
      background: #1a1e24;
    }

    .fileItem.active {
      background: #202630;
      border-color: #3b4655;
    }

    .fileName {
      font-size: 12px;
      font-weight: 600;
      word-break: break-word;
      line-height: 1.35;
    }

    .fileMeta {
      margin-top: 5px;
      color: #89929f;
      font-size: 11px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      border: 1px solid #343a43;
      border-radius: 20px;
      padding: 2px 6px;
    }

    .badge.good {
      color: #9ee6b1;
      border-color: #365b40;
    }

    .badge.warn {
      color: #f0c777;
      border-color: #675522;
    }

    /* =========================
       MAIN
    ========================= */

    #main {
      position: relative;
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      height: 52px;
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      background: #111419;
      border-bottom: 1px solid #2b3038;
    }

    #currentName {
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .toolbarControl {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #9aa3af;
      font-size: 11px;
    }

    #offsetInput {
      width: 75px;
      background: #1a1e24;
      border: 1px solid #363c46;
      color: white;
      border-radius: 6px;
      padding: 6px;
    }

    .toolbarButton {
      border: 1px solid #363c46;
      background: #1a1e24;
      color: white;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbarButton:hover {
      background: #242a32;
    }

    .toolbarButton.active {
      background: #fff;
      color: #111;
    }

    .toolbarButton.danger {
      color: #ffb6b6;
    }

    #manualGPXSelect {
      max-width: 220px;
      background: #1a1e24;
      border: 1px solid #363c46;
      color: #fff;
      border-radius: 6px;
      padding: 6px;
      display: none;
    }

    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #050607;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #emptyState {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: #79828f;
      text-align: center;
      padding: 30px;
    }

    /* =========================
       FLOATING MAP
    ========================= */

    #mapWindow {
      position: absolute;
      right: 20px;
      bottom: 100px;
      width: 410px;
      height: 300px;
      min-width: 250px;
      min-height: 180px;
      max-width: 80vw;
      max-height: 75vh;

      background: #111;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      overflow: hidden;
      resize: both;
      z-index: 50;

      box-shadow:
        0 18px 50px rgba(0,0,0,.45),
        0 0 0 1px rgba(0,0,0,.25);
    }

    #mapHeader {
      position: absolute;
      z-index: 1000;
      left: 0;
      top: 0;
      right: 0;
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      background: rgba(15,17,20,.90);
      backdrop-filter: blur(8px);
      cursor: move;
      user-select: none;
    }

    #mapHeaderTitle {
      font-size: 11px;
      font-weight: 700;
      flex: 1;
    }

    #mapHeaderStatus {
      font-size: 10px;
      color: #9ba5b2;
    }

    #map {
      position: absolute;
      inset: 34px 0 0 0;
      background: #222;
    }

    .currentMarker {
      width: 18px;
      height: 18px;
      background: #111;
      border: 4px solid white;
      border-radius: 50%;
      box-shadow: 0 2px 7px rgba(0,0,0,.45);
    }

    /* =========================
       FLOATING INFO STAMP
    ========================= */

    #infoOverlay {
      position: absolute;

      top: 16px;
      right: 16px;

      left: auto;
      bottom: auto;

      z-index: 60;

      background: rgba(8,10,12,.84);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;

      padding: 11px 13px;
      min-width: 260px;

      cursor: move;
      user-select: none;

      box-shadow: 0 8px 24px rgba(0,0,0,.28);
    }

    #absoluteTime {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #coordinates {
      margin-top: 5px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cbd2db;
    }

    #telemetry {
      margin-top: 5px;
      color: #929ca9;
      font-size: 11px;
    }

    #gpxMessage {
      color: #f0c777;
      margin-top: 5px;
      font-size: 10px;
    }

    /* =========================
       STATUS
    ========================= */

    #statusBar {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 20;

      background: rgba(0,0,0,.65);
      padding: 7px 10px;
      border-radius: 6px;

      font-size: 11px;
      color: #c3cad3;

      pointer-events: none;
      max-width: 550px;
    }

    .leaflet-control-attribution {
      font-size: 8px !important;
    }

    @media (max-width: 1000px) {
      #app {
        grid-template-columns: 230px 1fr;
      }

      #mapWindow {
        width: 320px;
        height: 240px;
      }

      #manualGPXSelect {
        max-width: 140px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <aside id="sidebar">

    <div class="sidebarHeader">

      <h1>Video + GPX Inspector</h1>

      <p>
        Chọn folder chứa MP4 và GPX.
        GPX chỉ tự mount khi trùng basename với video.
      </p>

      <button id="folderButton">
        Chọn folder
      </button>

      <input
        id="folderInput"
        type="file"
        webkitdirectory
        directory
        multiple
      />

      <div id="folderStats">
        Chưa chọn folder.
      </div>

    </div>

    <div id="fileList"></div>

  </aside>


  <main id="main">

    <div id="toolbar">

      <div id="currentName">
        Chưa chọn video
      </div>

      <label class="toolbarControl">
        GPS offset
        <input
          id="offsetInput"
          type="number"
          value="0"
          step="0.1"
        />
        s
      </label>

      <select id="manualGPXSelect"></select>

      <button
        id="mountGPXButton"
        class="toolbarButton"
      >
        Mount GPX
      </button>

      <button
        id="unmountGPXButton"
        class="toolbarButton danger"
      >
        Unmount
      </button>

      <button
        id="followButton"
        class="toolbarButton active"
      >
        Follow GPS
      </button>

    </div>


    <div id="stage">

      <video
        id="video"
        controls
        playsinline
      ></video>


      <div id="emptyState">
        <div>
          <strong>Chọn folder ở bên trái</strong>
          <br><br>
          Sau đó chọn một video để bắt đầu.
        </div>
      </div>


      <div id="statusBar">
        Chờ dữ liệu...
      </div>


      <div id="infoOverlay">

        <div id="absoluteTime">
          --:--:--
        </div>

        <div id="coordinates">
          --, --
        </div>

        <div id="telemetry">

          <span id="speed">
            Speed --
          </span>

          &nbsp;·&nbsp;

          <span id="heading">
            Heading --
          </span>

          &nbsp;·&nbsp;

          <span id="elevation">
            Elevation --
          </span>

        </div>

        <div id="gpxMessage"></div>

      </div>


      <div id="mapWindow">

        <div id="mapHeader">

          <div id="mapHeaderTitle">
            GPS minimap
          </div>

          <div id="mapHeaderStatus">
            NO GPS
          </div>

        </div>

        <div id="map"></div>

      </div>

    </div>

  </main>

</div>


<script>
/* ============================================================
   STATE
============================================================ */

const state = {

  videos: [],
  gpxFiles: [],
  tracks: [],

  currentVideo: null,
  currentTrack: null,

  marker: null,
  routeLine: null,

  followGPS: true,

  lastPosition: null,

  videoObjectURL: null,

  mountedManually: false
};


/* ============================================================
   DOM
============================================================ */

const folderButton =
  document.getElementById("folderButton");

const folderInput =
  document.getElementById("folderInput");

const folderStats =
  document.getElementById("folderStats");

const fileList =
  document.getElementById("fileList");

const video =
  document.getElementById("video");

const emptyState =
  document.getElementById("emptyState");

const currentName =
  document.getElementById("currentName");

const offsetInput =
  document.getElementById("offsetInput");

const followButton =
  document.getElementById("followButton");

const mountGPXButton =
  document.getElementById("mountGPXButton");

const unmountGPXButton =
  document.getElementById("unmountGPXButton");

const manualGPXSelect =
  document.getElementById("manualGPXSelect");

const absoluteTime =
  document.getElementById("absoluteTime");

const coordinates =
  document.getElementById("coordinates");

const speedEl =
  document.getElementById("speed");

const headingEl =
  document.getElementById("heading");

const elevationEl =
  document.getElementById("elevation");

const gpxMessage =
  document.getElementById("gpxMessage");

const statusBar =
  document.getElementById("statusBar");

const mapWindow =
  document.getElementById("mapWindow");

const mapHeader =
  document.getElementById("mapHeader");

const mapHeaderStatus =
  document.getElementById("mapHeaderStatus");

const infoOverlay =
  document.getElementById("infoOverlay");

const stage =
  document.getElementById("stage");


/* ============================================================
   MAP
============================================================ */

const map = L.map("map", {
  zoomControl: true,
  attributionControl: true
}).setView(
  [21.0285, 105.8542],
  14
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 20,
    attribution: "© OpenStreetMap"
  }
).addTo(map);


const markerIcon =
  L.divIcon({
    className: "",
    html:
      '<div class="currentMarker"></div>',
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });


/* ============================================================
   FILE BASENAME
============================================================ */

function getBaseName(name) {

  return name.replace(
    /\.[^.]+$/,
    ""
  );

}


function normalizeBaseName(name) {

  return getBaseName(name)
    .trim()
    .toLowerCase();

}


/* ============================================================
   FOLDER
============================================================ */

folderButton.addEventListener(
  "click",
  () => folderInput.click()
);


folderInput.addEventListener(
  "change",
  async event => {

    const files =
      [...event.target.files];


    state.videos =
      files.filter(file =>
        /\.(mp4|mov|m4v)$/i.test(file.name)
      );


    state.gpxFiles =
      files.filter(file =>
        /\.gpx$/i.test(file.name)
      );


    statusBar.textContent =
      "Đang đọc GPX...";


    state.tracks = [];


    for (const file of state.gpxFiles) {

      try {

        const track =
          await parseGPXFile(file);


        if (
          track.points.length
        ) {

          state.tracks.push(track);

        }

      } catch (error) {

        console.error(
          "GPX parse error:",
          file.name,
          error
        );

      }

    }


    state.videos.sort((a, b) => {

      const ta =
        inferVideoStartTime(a);

      const tb =
        inferVideoStartTime(b);

      if (
        ta &&
        tb
      ) {
        return ta - tb;
      }

      return a.name.localeCompare(b.name);

    });


    state.tracks.sort((a, b) =>
      a.name.localeCompare(b.name)
    );


    folderStats.innerHTML =
      `<strong>${state.videos.length}</strong> video · ` +
      `<strong>${state.gpxFiles.length}</strong> GPX · ` +
      `<strong>${state.tracks.length}</strong> track hợp lệ`;


    populateManualGPXSelect();

    renderFileList();


    statusBar.textContent =
      `Đã đọc ${state.videos.length} video và ` +
      `${state.tracks.length} GPS track.`;

  }
);


/* ============================================================
   PARSE GPX
============================================================ */

async function parseGPXFile(file) {

  const text =
    await file.text();


  const parser =
    new DOMParser();


  const xml =
    parser.parseFromString(
      text,
      "application/xml"
    );


  if (
    xml.querySelector("parsererror")
  ) {
    throw new Error(
      "Invalid GPX XML"
    );
  }


  let nodes =
    [...xml.getElementsByTagName("trkpt")];


  if (!nodes.length) {

    nodes =
      [...xml.getElementsByTagName("rtept")];

  }


  if (!nodes.length) {

    nodes =
      [...xml.getElementsByTagName("wpt")];

  }


  const points = [];


  for (const node of nodes) {

    const lat =
      parseFloat(
        node.getAttribute("lat")
      );


    const lon =
      parseFloat(
        node.getAttribute("lon")
      );


    const timeNode =
      node.getElementsByTagName("time")[0];


    const eleNode =
      node.getElementsByTagName("ele")[0];


    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lon) ||
      !timeNode
    ) {
      continue;
    }


    const time =
      new Date(
        timeNode.textContent.trim()
      );


    if (
      Number.isNaN(
        time.getTime()
      )
    ) {
      continue;
    }


    const ele =
      eleNode
        ? parseFloat(eleNode.textContent)
        : null;


    points.push({

      lat,
      lon,

      time,

      timestamp:
        time.getTime(),

      ele:
        Number.isFinite(ele)
          ? ele
          : null

    });

  }


  points.sort(
    (a, b) =>
      a.timestamp -
      b.timestamp
  );


  for (
    let i = 0;
    i < points.length;
    i++
  ) {

    if (i === 0) {

      points[i].speed = null;
      points[i].heading = null;

      continue;

    }


    const prev =
      points[i - 1];

    const curr =
      points[i];


    const distance =
      haversineDistance(
        prev.lat,
        prev.lon,
        curr.lat,
        curr.lon
      );


    const dt =
      (
        curr.timestamp -
        prev.timestamp
      ) / 1000;


    curr.speed =
      dt > 0
        ? (
            distance /
            dt
          ) * 3.6
        : null;


    curr.heading =
      calculateBearing(
        prev.lat,
        prev.lon,
        curr.lat,
        curr.lon
      );

  }


  return {

    file,

    name:
      file.name,

    basename:
      normalizeBaseName(file.name),

    points,

    startTime:
      points.length
        ? points[0].timestamp
        : null,

    endTime:
      points.length
        ? points[
            points.length - 1
          ].timestamp
        : null

  };

}


/* ============================================================
   VIDEO TIME
============================================================ */

function inferVideoStartTime(file) {

  const regex =
    /(\d{4})-(\d{2})-(\d{2}).*?(\d{1,2})h\s*(\d{1,2})m\s*(\d{1,2})s/i;


  const match =
    file.name.match(regex);


  if (match) {

    const [
      _,
      year,
      month,
      day,
      hour,
      minute,
      second
    ] = match;


    return new Date(

      Number(year),

      Number(month) - 1,

      Number(day),

      Number(hour),

      Number(minute),

      Number(second)

    ).getTime();

  }


  return (
    file.lastModified ||
    null
  );

}


/* ============================================================
   EXACT GPX MATCH
============================================================ */

function findExactGPXForVideo(file) {

  const basename =
    normalizeBaseName(
      file.name
    );


  return (
    state.tracks.find(
      track =>
        track.basename === basename
    ) || null
  );

}


/* ============================================================
   FILE LIST
============================================================ */

function renderFileList() {

  fileList.innerHTML = "";


  for (
    const file of state.videos
  ) {

    const start =
      inferVideoStartTime(file);


    const exactTrack =
      findExactGPXForVideo(file);


    const item =
      document.createElement("div");


    item.className =
      "fileItem";


    const timeLabel =
      start
        ? formatTime(
            new Date(start)
          )
        : "Không rõ giờ";


    item.innerHTML = `
      <div class="fileName">
        ${escapeHTML(file.name)}
      </div>

      <div class="fileMeta">

        <span class="badge">
          ${timeLabel}
        </span>

        ${
          exactTrack
            ? `
              <span class="badge good">
                GPX trùng tên
              </span>
            `
            : `
              <span class="badge warn">
                Chưa mount GPX
              </span>
            `
        }

      </div>
    `;


    item.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            ".fileItem"
          )
          .forEach(
            el =>
              el.classList.remove(
                "active"
              )
          );


        item.classList.add(
          "active"
        );


        loadVideo(file);

      }
    );


    fileList.appendChild(
      item
    );

  }

}


/* ============================================================
   LOAD VIDEO
============================================================ */

function loadVideo(file) {

  state.currentVideo = {

    file,

    startTime:
      inferVideoStartTime(file)

  };


  state.currentTrack = null;
  state.mountedManually = false;


  if (
    state.videoObjectURL
  ) {

    URL.revokeObjectURL(
      state.videoObjectURL
    );

  }


  state.videoObjectURL =
    URL.createObjectURL(file);


  video.src =
    state.videoObjectURL;


  currentName.textContent =
    file.name;


  emptyState.style.display =
    "none";


  resetMap();


  resetTelemetry();


  statusBar.textContent =
    "Đang tải video...";


  video.onloadedmetadata =
    () => {

      const start =
        state.currentVideo.startTime;


      state.currentVideo.endTime =
        start +
        video.duration * 1000;


      const exactTrack =
        findExactGPXForVideo(
          file
        );


      if (exactTrack) {

        mountTrack(
          exactTrack,
          false
        );

      } else {

        statusBar.textContent =
          "Không có GPX trùng tên. Có thể mount thủ công.";


        mapHeaderStatus.textContent =
          "NO GPS";


        gpxMessage.textContent =
          "Chưa mount GPX";

      }


      updateFrameInfo();

    };

}


/* ============================================================
   MANUAL GPX UI
============================================================ */

function populateManualGPXSelect() {

  manualGPXSelect.innerHTML =
    "";


  const placeholder =
    document.createElement("option");


  placeholder.value = "";
  placeholder.textContent =
    "Chọn GPX...";


  manualGPXSelect.appendChild(
    placeholder
  );


  state.tracks.forEach(
    (track, index) => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        String(index);


      option.textContent =
        track.name;


      manualGPXSelect.appendChild(
        option
      );

    }
  );

}


mountGPXButton.addEventListener(
  "click",
  () => {

    if (!state.currentVideo) {

      alert(
        "Hãy chọn video trước."
      );

      return;

    }


    manualGPXSelect.style.display =
      "block";


    if (
      manualGPXSelect.value !== ""
    ) {

      const index =
        Number(
          manualGPXSelect.value
        );


      const track =
        state.tracks[index];


      if (track) {

        mountTrack(
          track,
          true
        );

      }

    }

  }
);


manualGPXSelect.addEventListener(
  "change",
  () => {

    if (
      manualGPXSelect.value === ""
    ) {
      return;
    }


    const index =
      Number(
        manualGPXSelect.value
      );


    const track =
      state.tracks[index];


    if (track) {

      mountTrack(
        track,
        true
      );

    }

  }
);


unmountGPXButton.addEventListener(
  "click",
  () => {

    state.currentTrack = null;
    state.mountedManually = false;


    resetMap();

    resetTelemetry();


    gpxMessage.textContent =
      "GPX đã unmount";


    statusBar.textContent =
      "Không có GPX được mount.";


    mapHeaderStatus.textContent =
      "NO GPS";


    manualGPXSelect.value =
      "";

  }
);


/* ============================================================
   MOUNT TRACK
============================================================ */

function mountTrack(
  track,
  manual
) {

  state.currentTrack =
    track;


  state.mountedManually =
    manual;


  drawTrack(
    track
  );


  mapHeaderStatus.textContent =
    manual
      ? "MANUAL GPS"
      : "GPS READY";


  statusBar.textContent =
    manual
      ? `GPX mount thủ công: ${track.name}`
      : `GPX: ${track.name}`;


  gpxMessage.textContent =
    manual
      ? `Manual: ${track.name}`
      : track.name;


  updateFrameInfo();

}


/* ============================================================
   VIDEO -> GPS
============================================================ */

video.addEventListener(
  "timeupdate",
  updateFrameInfo
);


video.addEventListener(
  "seeking",
  updateFrameInfo
);


video.addEventListener(
  "seeked",
  updateFrameInfo
);


offsetInput.addEventListener(
  "input",
  updateFrameInfo
);


function updateFrameInfo() {

  if (
    !state.currentVideo
  ) {
    return;
  }


  const offsetSeconds =
    parseFloat(
      offsetInput.value
    ) || 0;


  const timestamp =
    state.currentVideo.startTime +
    video.currentTime * 1000 +
    offsetSeconds * 1000;


  const date =
    new Date(timestamp);


  absoluteTime.textContent =
    formatDateTime(date);


  if (
    !state.currentTrack
  ) {

    coordinates.textContent =
      "--, --";


    speedEl.textContent =
      "Speed --";


    headingEl.textContent =
      "Heading --";


    elevationEl.textContent =
      "Elevation --";


    return;

  }


  const position =
    interpolateTrack(
      state.currentTrack.points,
      timestamp
    );


  if (!position) {

    coordinates.textContent =
      "--, --";


    speedEl.textContent =
      "Speed --";


    headingEl.textContent =
      "Heading --";


    elevationEl.textContent =
      "Elevation --";


    gpxMessage.textContent =
      `${state.currentTrack.name} · ngoài khoảng thời gian GPX`;


    return;

  }


  state.lastPosition =
    position;


  coordinates.textContent =
    `${position.lat.toFixed(6)}, ${position.lon.toFixed(6)}`;


  speedEl.textContent =
    position.speed != null
      ? `${position.speed.toFixed(1)} km/h`
      : "Speed --";


  headingEl.textContent =
    position.heading != null
      ? `${Math.round(position.heading)}°`
      : "Heading --";


  elevationEl.textContent =
    position.ele != null
      ? `${position.ele.toFixed(1)} m`
      : "Elevation --";


  gpxMessage.textContent =
    state.mountedManually
      ? `Manual: ${state.currentTrack.name}`
      : state.currentTrack.name;


  updateMapPosition(
    position
  );

}


/* ============================================================
   INTERPOLATION
============================================================ */

function interpolateTrack(
  points,
  timestamp
) {

  if (!points.length) {
    return null;
  }


  if (
    timestamp <
      points[0].timestamp ||
    timestamp >
      points[
        points.length - 1
      ].timestamp
  ) {
    return null;
  }


  let low = 0;

  let high =
    points.length - 1;


  while (
    low <= high
  ) {

    const mid =
      Math.floor(
        (low + high) / 2
      );


    if (
      points[mid].timestamp <
      timestamp
    ) {

      low =
        mid + 1;

    } else {

      high =
        mid - 1;

    }

  }


  const rightIndex =
    Math.min(
      low,
      points.length - 1
    );


  const leftIndex =
    Math.max(
      0,
      rightIndex - 1
    );


  const a =
    points[leftIndex];


  const b =
    points[rightIndex];


  if (
    a.timestamp ===
    b.timestamp
  ) {

    return {
      ...a
    };

  }


  const ratio =
    (
      timestamp -
      a.timestamp
    ) /
    (
      b.timestamp -
      a.timestamp
    );


  return {

    lat:
      lerp(
        a.lat,
        b.lat,
        ratio
      ),

    lon:
      lerp(
        a.lon,
        b.lon,
        ratio
      ),

    ele:
      interpolateNullable(
        a.ele,
        b.ele,
        ratio
      ),

    speed:
      interpolateNullable(
        a.speed,
        b.speed,
        ratio
      ),

    heading:
      interpolateAngle(
        a.heading,
        b.heading,
        ratio
      ),

    timestamp

  };

}


/* ============================================================
   MAP
============================================================ */

function resetMap() {

  if (
    state.marker
  ) {

    map.removeLayer(
      state.marker
    );


    state.marker = null;

  }


  if (
    state.routeLine
  ) {

    map.removeLayer(
      state.routeLine
    );


    state.routeLine = null;

  }

}


function drawTrack(track) {

  if (
    state.routeLine
  ) {

    map.removeLayer(
      state.routeLine
    );

  }


  const latlngs =
    track.points.map(
      point => [
        point.lat,
        point.lon
      ]
    );


  state.routeLine =
    L.polyline(
      latlngs,
      {
        weight: 4,
        opacity: 0.75
      }
    ).addTo(map);


  if (
    latlngs.length
  ) {

    map.fitBounds(
      state.routeLine.getBounds(),
      {
        padding: [25, 25]
      }
    );

  }


  setTimeout(
    () =>
      map.invalidateSize(),
    100
  );

}


function updateMapPosition(
  position
) {

  const latlng = [
    position.lat,
    position.lon
  ];


  if (
    !state.marker
  ) {

    state.marker =
      L.marker(
        latlng,
        {
          icon:
            markerIcon,

          zIndexOffset:
            1000
        }
      ).addTo(map);

  } else {

    state.marker.setLatLng(
      latlng
    );

  }


  if (
    state.followGPS
  ) {

    const zoom =
      Math.max(
        map.getZoom(),
        17
      );


    map.setView(
      latlng,
      zoom,
      {
        animate: false
      }
    );

  }

}


/* ============================================================
   FOLLOW GPS
============================================================ */

followButton.addEventListener(
  "click",
  () => {

    state.followGPS =
      !state.followGPS;


    followButton.classList.toggle(
      "active",
      state.followGPS
    );


    followButton.textContent =
      state.followGPS
        ? "Follow GPS"
        : "Free map";


    if (
      state.followGPS &&
      state.lastPosition
    ) {

      map.setView(
        [
          state.lastPosition.lat,
          state.lastPosition.lon
        ],
        Math.max(
          map.getZoom(),
          17
        )
      );

    }

  }
);


/* ============================================================
   GENERIC DRAGGABLE FLOATING PANEL
============================================================ */

function makeDraggable(
  element,
  handle
) {

  let dragging = false;

  let startX = 0;
  let startY = 0;

  let startLeft = 0;
  let startTop = 0;


  handle.addEventListener(
    "mousedown",
    event => {

      if (
        event.button !== 0
      ) {
        return;
      }


      dragging = true;


      const elementRect =
        element.getBoundingClientRect();


      const stageRect =
        stage.getBoundingClientRect();


      element.style.left =
        `${elementRect.left - stageRect.left}px`;


      element.style.top =
        `${elementRect.top - stageRect.top}px`;


      element.style.right =
        "auto";


      element.style.bottom =
        "auto";


      startX =
        event.clientX;


      startY =
        event.clientY;


      startLeft =
        elementRect.left -
        stageRect.left;


      startTop =
        elementRect.top -
        stageRect.top;


      event.preventDefault();

    }
  );


  window.addEventListener(
    "mousemove",
    event => {

      if (
        !dragging
      ) {
        return;
      }


      const stageRect =
        stage.getBoundingClientRect();


      const elementRect =
        element.getBoundingClientRect();


      let left =
        startLeft +
        event.clientX -
        startX;


      let top =
        startTop +
        event.clientY -
        startY;


      left =
        Math.max(
          0,
          Math.min(
            left,
            stageRect.width -
            elementRect.width
          )
        );


      top =
        Math.max(
          0,
          Math.min(
            top,
            stageRect.height -
            elementRect.height
          )
        );


      element.style.left =
        `${left}px`;


      element.style.top =
        `${top}px`;

    }
  );


  window.addEventListener(
    "mouseup",
    () => {

      dragging = false;

    }
  );

}


/* map window */
makeDraggable(
  mapWindow,
  mapHeader
);


/* info stamp */
makeDraggable(
  infoOverlay,
  infoOverlay
);


/* ============================================================
   RESIZE OBSERVER
============================================================ */

const resizeObserver =
  new ResizeObserver(

      map.invalidateSize();

    }
  );


resizeObserver.observe(

/* ============================================================
   TELEMETRY RESET
============================================================ */

function resetTelemetry() {

  coordinates.textContent =
    "--, --";


  speedEl.textContent =
    "Speed --";


  headingEl.textContent =
    "Heading --";


  elevationEl.textContent =
    "Elevation --";


  state.lastPosition =
    null;

}


/* ============================================================
   GEOMETRY
============================================================ */

function haversineDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;


  const phi1 =
    toRad(lat1);


  const phi2 =
    toRad(lat2);


  const dPhi =
    toRad(
      lat2 -
      lat1
    );


  const dLambda =
    toRad(
      lon2 -
      lon1
    );


  const a =
    Math.sin(
      dPhi / 2
    ) ** 2 +

    Math.cos(phi1) *
    Math.cos(phi2) *

    Math.sin(
      dLambda / 2
    ) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return (
    R *
    c
  );

}


function calculateBearing(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const phi1 =
    toRad(lat1);


  const phi2 =
    toRad(lat2);


  const lambda =
    toRad(
      lon2 -
      lon1
    );


  const y =
    Math.sin(lambda) *
    Math.cos(phi2);


  const x =
    Math.cos(phi1) *
    Math.sin(phi2) -

    Math.sin(phi1) *
    Math.cos(phi2) *
    Math.cos(lambda);


  const bearing =
    toDeg(
      Math.atan2(
        y,
        x
      )
    );


  return (
    bearing +
    360
  ) % 360;

}


/* ============================================================
   HELPERS
============================================================ */

function lerp(
  a,
  b,
  t
) {

  return (
    a +
    (
      b -
      a
    ) *
    t
  );

}


function interpolateNullable(
  a,
  b,
  t
) {

  if (
    a == null &&
    b == null
  ) {

    return null;

  }


  if (
    a == null
  ) {

    return b;

  }


  if (
    b == null
  ) {

    return a;

  }


  return lerp(
    a,
    b,
    t
  );

}


function interpolateAngle(
  a,
  b,
  t
) {

  if (
    a == null &&
    b == null
  ) {

    return null;

  }


  if (
    a == null
  ) {

    return b;

  }


  if (
    b == null
  ) {

    return a;

  }


  const delta =
    (
      (
        b -
        a +
        540
      ) %
      360
    ) -
    180;


  return (
    a +
    delta *
    t +
    360
  ) % 360;

}


function toRad(value) {

  return (
    value *
    Math.PI /
    180
  );

}


function toDeg(value) {

  return (
    value *
    180 /
    Math.PI
  );

}


function formatTime(date) {

  return date.toLocaleTimeString(
    "vi-VN",
    {
      hour:
        "2-digit",

      minute:
        "2-digit",

      second:
        "2-digit",

      hour12:
        false
    }
  );

}


function formatDateTime(date) {

  const milliseconds =
    String(
      date.getMilliseconds()
    ).padStart(
      3,
      "0"
    );


  return (
    date.toLocaleString(
      "vi-VN",
      {
        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false
      }
    ) +
    "." +
    milliseconds
  );

}


function escapeHTML(value) {

  return value
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ============================================================
   KEYBOARD
============================================================ */

window.addEventListener(
  "keydown",
  event => {

    if (
      document.activeElement ===
      offsetInput
    ) {

      return;

    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();


      if (
        video.paused
      ) {

        video.play();

      } else {

        video.pause();

      }

    }


    if (
      event.code ===
      "ArrowLeft" &&
      !event.shiftKey
    ) {

      event.preventDefault();


      video.currentTime =
        Math.max(
          0,
          video.currentTime -
          1
        );

    }


    if (
      event.code ===
      "ArrowRight" &&
      !event.shiftKey
    ) {

      event.preventDefault();


      video.currentTime =
        Math.min(
          video.duration ||
          Infinity,

          video.currentTime +
          1
        );

    }


    if (
      event.code ===
      "ArrowLeft" &&
      event.shiftKey
    ) {

      event.preventDefault();


      video.currentTime =
        Math.max(
          0,
          video.currentTime -
          0.1
        );

    }


    if (
      event.code ===
      "ArrowRight" &&
      event.shiftKey
    ) {

      event.preventDefault();


      video.currentTime =
        Math.min(
          video.duration ||
          Infinity,

          video.currentTime +
          0.1
        );

    }

  }
);


/* ============================================================
   INITIAL
============================================================ */

setTimeout(
  () =>
    map.invalidateSize(),
  300
);

</script>
