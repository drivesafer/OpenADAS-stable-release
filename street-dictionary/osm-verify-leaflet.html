<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Way Verifier — OSM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root {
  --ground:   #F4F4EF;
  --panel:    #FFFFFF;
  --panel-2:  #EDEEE7;
  --ink:      #15252B;
  --ink-soft: #3C4F53;
  --muted:    #566765;
  --rule:     #D6D8CF;
  --rule-2:   #B9BDB2;
  --accent:   #0E6B63;
  --accent-2: #D8E8E5;
  --ok:       #1F6038;
  --ok-bg:    #DFEDE2;
  --warn:     #7D4B0B;
  --warn-bg:  #F3E6CE;
  --bad:      #8E2C21;
  --bad-bg:   #F3DEDA;
  --shadow:   rgba(21,37,43,.14);
  --body: "Be Vietnam Pro", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:   #101A1C;  --panel:   #172326;  --panel-2: #1D2B2E;
    --ink:      #E7EAE4;  --ink-soft:#BFC8C5;  --muted:   #8B9B98;
    --rule:     #2B3A3D;  --rule-2:  #3E5154;
    --accent:   #4FAEA2;  --accent-2:#1C3A38;
    --ok:       #6FC08C;  --ok-bg:   #1B3326;
    --warn:     #D9A24E;  --warn-bg: #382C14;
    --bad:      #E08273;  --bad-bg:  #3A1F1B;
    --shadow:   rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --ground:   #101A1C;  --panel:   #172326;  --panel-2: #1D2B2E;
  --ink:      #E7EAE4;  --ink-soft:#BFC8C5;  --muted:   #8B9B98;
  --rule:     #2B3A3D;  --rule-2:  #3E5154;
  --accent:   #4FAEA2;  --accent-2:#1C3A38;
  --ok:       #6FC08C;  --ok-bg:   #1B3326;
  --warn:     #D9A24E;  --warn-bg: #382C14;
  --bad:      #E08273;  --bad-bg:  #3A1F1B;
  --shadow:   rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.app > *, .split > * { min-width: 0; }

/* top bar */
.bar {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 11px 18px; background: var(--panel);
  border-bottom: 1px solid var(--rule-2);
}
.brand { font-weight: 700; font-size: 15px; white-space: nowrap; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 210px; max-width: 320px; }
.field label {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
input[type=search], select {
  font-family: var(--body); font-size: 13.5px; color: var(--ink);
  background: var(--ground); border: 1px solid var(--rule-2);
  border-radius: 3px; padding: 6px 10px; width: 100%; min-width: 0;
}
select { cursor: pointer; }
input:focus-visible, select:focus-visible, button:focus-visible,
.srow:focus-visible, .wrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.barstat {
  margin-left: auto; display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
  font-family: var(--mono); font-size: 12px; color: var(--muted);
}
.barstat b { color: var(--ink); font-weight: 600; }

/* split */
.split { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
aside {
  background: var(--panel); border-right: 1px solid var(--rule-2);
  display: flex; flex-direction: column; min-height: 0;
}
.filters { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px; border-bottom: 1px solid var(--rule); }
.fbtn {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  padding: 4px 8px; border: 1px solid var(--rule-2); background: transparent;
  color: var(--muted); cursor: pointer; border-radius: 2px;
}
.fbtn:hover { border-color: var(--accent); color: var(--accent); }
.fbtn[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .fbtn[aria-pressed=true],
:root:not([data-theme="light"]) .fbtn[aria-pressed=true] { color: #0E1718; }

.scroll { overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1; }
.shead {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted); padding: 10px 12px 6px;
  position: sticky; top: 0; background: var(--panel);
  border-bottom: 1px solid var(--rule); z-index: 2;
}
.srow {
  display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
  padding: 7px 12px; border-bottom: 1px solid var(--rule); width: 100%;
  text-align: left; background: transparent; color: inherit; cursor: pointer;
  border-left: 3px solid transparent; font-family: var(--body); font-size: 13px;
}
.srow:hover { background: var(--panel-2); }
.srow[aria-current=true] { background: var(--accent-2); border-left-color: var(--accent); }
.srow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .ct { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.s0 { background: var(--ok); }     .dot.s1 { background: var(--accent); }
.dot.s2 { background: var(--warn); }   .dot.s3 { background: var(--bad); }
.dot.s4 { background: var(--rule-2); }

.detail { border-top: 1px solid var(--rule-2); background: var(--panel-2); max-height: 48%; display: flex; flex-direction: column; }
.dhead { padding: 11px 12px 9px; border-bottom: 1px solid var(--rule); }
.dtitle { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.dmeta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.dnote {
  font-size: 11.5px; line-height: 1.45; margin-top: 7px; padding: 6px 8px;
  border-left: 2px solid var(--warn); background: var(--warn-bg); color: var(--warn);
}
.dnote.bad { border-left-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.wrow {
  display: grid; grid-template-columns: 9px 1fr auto; gap: 8px; align-items: center;
  padding: 5px 12px; border-bottom: 1px solid var(--rule); width: 100%;
  text-align: left; background: transparent; color: inherit; cursor: pointer;
  font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums;
}
.wrow:hover { background: var(--panel); }
.wrow[aria-current=true] { background: var(--accent-2); }
.wsw { width: 9px; height: 9px; border-radius: 2px; }
.wrow .wi { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrow .wl { color: var(--muted); }
.empty { padding: 26px 16px; color: var(--muted); font-size: 12.5px; text-align: center; line-height: 1.6; }

/* map */
#map { width: 100%; height: 100%; background: var(--panel-2); }
.leaflet-container { font-family: var(--body); }
.leaflet-popup-content { margin: 11px 13px; font-size: 13px; line-height: 1.55; }
.leaflet-popup-content b { font-family: var(--mono); font-size: 12.5px; }
.pop-n { color: #4a5a5e; font-size: 12.5px; }
.pop-m { font-family: var(--mono); font-size: 11.5px; color: #6a7a7e; }
.pop-w { color: #8E2C21; font-weight: 600; font-size: 11.5px; }
.leaflet-popup-content a { color: #0E6B63; }

.legend {
  background: var(--panel); border: 1px solid var(--rule-2); border-radius: 3px;
  padding: 9px 11px; box-shadow: 0 1px 5px var(--shadow);
  font-size: 11.5px; display: flex; flex-direction: column; gap: 5px;
  color: var(--ink); max-width: 220px;
}
.lrow { display: flex; align-items: center; gap: 7px; }
.lsw { width: 18px; height: 4px; border-radius: 2px; flex-shrink: 0; }
.lnote { color: var(--muted); font-size: 10.5px; line-height: 1.4; margin-top: 2px; }

@media (max-width: 860px) {
  html, body { height: auto; overflow: visible; }
  .app { height: auto; }
  .split { grid-template-columns: 1fr; }
  aside { border-right: none; border-bottom: 1px solid var(--rule-2); }
  .scroll { max-height: 220px; }
  .detail { max-height: none; }
  #map { height: 70vh; }
  .barstat { margin-left: 0; width: 100%; }
  .field { max-width: none; flex: 1 1 140px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <div class="brand">Way <span>Verifier</span></div>
    <div class="field">
      <label for="q">Tìm tên đường hoặc way_id</label>
      <input type="search" id="q" placeholder="vd: Phúc Diễn · phuc dien · 669491670" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="pick">Chọn đường</label>
      <select id="pick"></select>
    </div>
    <div class="barstat" id="stat"></div>
  </div>

  <div class="split">
    <aside>
      <div class="filters" id="filters"></div>
      <div class="scroll" id="list"></div>
      <div class="detail" id="detail" hidden>
        <div class="dhead">
          <div class="dtitle" id="dtitle"></div>
          <div class="dmeta" id="dmeta"></div>
          <div id="dnote"></div>
        </div>
        <div class="scroll" id="wlist"></div>
      </div>
    </aside>
    <div id="map"></div>
  </div>
</div>

<script>
(() => {
"use strict";

if (typeof L === "undefined") {
  document.getElementById("map").innerHTML =
    '<div class="empty">Không tải được Leaflet từ CDN.<br>Kiểm tra kết nối mạng rồi tải lại trang.</div>';
  return;
}

const D = window.MAPDATA;

/* ---------- polyline decode ---------- */
function decode(str) {
  const pts = []; let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    let r = 0, s = 0, b;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20);
    lat += (r & 1) ? ~(r >> 1) : (r >> 1);
    r = 0; s = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20);
    lon += (r & 1) ? ~(r >> 1) : (r >> 1);
    pts.push([lat / 1e5, lon / 1e5]);
  }
  return pts;
}

const WAYS = D.ways.map(w => ({
  pts: decode(w[0]), name: D.names[w[1]], hw: D.hw[w[2]], len: w[3], id: w[4],
}));
const STATUS_NAME = ["COMPLETE", "LIKELY_COMPLETE", "NEEDS_REVIEW", "BAD", "NO_DATA"];

/* cụm chính dùng màu chủ đạo; cụm rời dùng màu khác để bật lên */
const MAIN = "#0E6B63";
const COMP = ["", "#D9661F", "#B4218E", "#6B3FC4", "#1565C0", "#B23A20", "#1B7F3B", "#8A7A14"];
const TWIN = "#C62828";

/* ---------- map ---------- */
const map = L.map("map", { preferCanvas: true, zoomControl: true })
  .setView([21.0278, 105.8342], 13);

const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
});
const light = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  maxZoom: 20, subdomains: "abcd",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
});
osm.addTo(map);
L.control.layers({ "OpenStreetMap": osm, "Nền nhạt (dễ nhìn way)": light }, null,
                 { position: "topright" }).addTo(map);
L.control.scale({ imperial: false, position: "bottomright" }).addTo(map);

const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = [
    [MAIN, "Đường đang chọn — cụm chính"],
    [COMP[1], "Cụm rời khỏi cụm chính"],
    [TWIN, "Nửa bị tách do lỗi dấu"],
  ].map(([c, t]) => `<div class="lrow"><span class="lsw" style="background:${c}"></span><span>${t}</span></div>`).join("")
   + '<div class="lnote">Bấm vào way để xem way_id · mở được trên openstreetmap.org</div>';
  L.DomEvent.disableClickPropagation(d);
  return d;
};
legend.addTo(map);

const layer = L.layerGroup().addTo(map);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* mỗi way vẽ 2 lớp: viền trắng bên dưới cho nổi trên nền bản đồ, màu bên trên */
const lineOf = new Map();          // chỉ số way -> polyline màu
function drawWay(wi, color, weight) {
  const w = WAYS[wi];
  L.polyline(w.pts, { color: "#fff", weight: weight + 4, opacity: .85, interactive: false }).addTo(layer);
  const ln = L.polyline(w.pts, { color, weight, opacity: 1 }).addTo(layer);
  ln.bindPopup(
    `<b>way/${w.id}</b><br><span class="pop-n">${esc(w.name)}</span><br>` +
    `<span class="pop-m">${esc(w.hw)} · ${w.len} m</span><br>` +
    `<a href="https://www.openstreetmap.org/way/${w.id}" target="_blank" rel="noopener">Mở trên OpenStreetMap ↗</a>`
  );
  ln.on("click", () => syncWayRow(wi));
  lineOf.set(wi, ln);
  return ln;
}

/* ---------- state ---------- */
let sel = null, filter = -1, query = "";
const byName = new Map(D.streets.map(s => [s.n, s]));
const FOLD = s => s.toLowerCase().replace(/\u0111/g, "d")
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function render() {
  layer.clearLayers(); lineOf.clear();
  if (!sel) return;
  const twin = sel.sp ? byName.get(sel.sp) : null;
  if (twin) twin.w.forEach(wi => drawWay(wi, TWIN, 5));
  sel.w.forEach((wi, k) => {
    const c = sel.c[k] || 0;
    drawWay(wi, c === 0 ? MAIN : (COMP[c % COMP.length] || COMP[1]), 5);
  });
}

function fitSel() {
  if (!sel || !sel.w.length) return;
  const all = sel.w.concat(sel.sp && byName.get(sel.sp) ? byName.get(sel.sp).w : []);
  map.fitBounds(L.latLngBounds(all.flatMap(wi => WAYS[wi].pts)), { padding: [40, 40] });
}

/* ---------- list ---------- */
const listEl = document.getElementById("list"), pickEl = document.getElementById("pick");
const qEl = document.getElementById("q"), detEl = document.getElementById("detail");

function visible() {
  const q = FOLD(query.trim());
  return D.streets.filter(s => {
    if (filter >= 0 && s.s !== filter) return false;
    if (!q) return true;
    if (s.f.includes(q)) return true;
    if (/^\d{4,}$/.test(q)) return s.w.some(i => String(WAYS[i].id).includes(q));
    return s.w.some(i => FOLD(WAYS[i].name).includes(q));
  });
}

function renderList() {
  const rows = visible();
  pickEl.innerHTML = "";
  const ph = document.createElement("option");
  ph.value = ""; ph.textContent = `— ${rows.length} đường —`;
  pickEl.appendChild(ph);
  for (const s of rows) {
    const o = document.createElement("option");
    o.value = s.n; o.textContent = `${s.n} (${s.w.length})`;
    pickEl.appendChild(o);
  }
  if (sel) pickEl.value = sel.n;

  listEl.innerHTML = "";
  const h = document.createElement("div");
  h.className = "shead";
  h.textContent = `${rows.length} đường · ${rows.reduce((a, s) => a + s.w.length, 0)} way`;
  listEl.appendChild(h);
  if (!rows.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Không có đường nào khớp. Thử bỏ dấu, hoặc dán way_id dạng số.";
    listEl.appendChild(e);
    return;
  }
  const frag = document.createDocumentFragment();
  for (const s of rows) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "srow";
    if (sel && sel.n === s.n) b.setAttribute("aria-current", "true");
    b.innerHTML = `<span class="nm">${esc(s.n)}</span><span class="ct">${s.w.length}</span>` +
                  `<span class="dot s${s.s}" title="${STATUS_NAME[s.s]}"></span>`;
    b.onclick = () => select(s.n, true);
    frag.appendChild(b);
  }
  listEl.appendChild(frag);
}

function select(name, doFit) {
  sel = byName.get(name) || null;
  renderList(); renderDetail(); render();
  if (doFit) fitSel();
}

function renderDetail() {
  if (!sel) { detEl.hidden = true; return; }
  detEl.hidden = false;
  document.getElementById("dtitle").textContent = sel.n;
  const pieces = new Set(sel.c).size;
  document.getElementById("dmeta").textContent =
    `${sel.w.length} way · ${sel.l.toLocaleString("vi-VN")} m · ${sel.p}% · ${pieces} cụm`;

  const note = document.getElementById("dnote");
  note.className = ""; note.innerHTML = "";
  if (!sel.w.length) {
    note.className = "dnote";
    note.textContent = "Đường này có địa chỉ nhưng không có way nào trong vùng OSM đã thu thập, nên không vẽ được.";
  } else if (sel.sp) {
    note.className = "dnote bad";
    note.innerHTML = `Bị tách đôi do lỗi dấu — nửa còn lại nằm ở <b>${esc(sel.sp)}</b>, đang vẽ màu đỏ. Hai nửa phải nằm trên cùng một con đường.`;
  } else if (sel.s === 3) {
    note.className = "dnote bad";
    note.textContent = "Tên chuẩn là số trần — các way này khớp vào số nhà, không phải tên đường.";
  } else if (pieces > 1) {
    note.className = "dnote";
    note.textContent = `${pieces} cụm rời nhau. Mỗi cụm một màu — kiểm tra xem cụm khác màu có nằm đúng trên đường này không.`;
  }

  const wl = document.getElementById("wlist");
  wl.innerHTML = "";
  const frag = document.createDocumentFragment();
  sel.w.forEach((wi, k) => {
    const w = WAYS[wi], c = sel.c[k] || 0;
    const b = document.createElement("button");
    b.type = "button"; b.className = "wrow"; b.dataset.wi = wi; b.title = w.name;
    b.innerHTML = `<span class="wsw" style="background:${c === 0 ? MAIN : (COMP[c % COMP.length] || COMP[1])}"></span>` +
                  `<span class="wi">way/${w.id}</span><span class="wl">${w.len} m</span>`;
    b.onmouseenter = () => { const ln = lineOf.get(wi); if (ln) ln.setStyle({ weight: 9 }); };
    b.onmouseleave = () => { const ln = lineOf.get(wi); if (ln) ln.setStyle({ weight: 5 }); };
    b.onclick = () => {
      const ln = lineOf.get(wi);
      map.fitBounds(L.latLngBounds(WAYS[wi].pts), { padding: [70, 70], maxZoom: 18 });
      if (ln) ln.openPopup();
      syncWayRow(wi);
    };
    frag.appendChild(b);
  });
  wl.appendChild(frag);
}

function syncWayRow(wi) {
  document.querySelectorAll(".wrow").forEach(r => {
    if (+r.dataset.wi === wi) r.setAttribute("aria-current", "true");
    else r.removeAttribute("aria-current");
  });
  const row = document.querySelector(`.wrow[data-wi="${wi}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
}

/* ---------- filters ---------- */
const COUNTS = [0, 0, 0, 0, 0];
D.streets.forEach(s => COUNTS[s.s]++);
const FBTN = [["Tất cả", -1], ["Hoàn chỉnh", 0], ["Có khoảng hở", 1],
              ["Cần soát", 2], ["Lỗi", 3], ["Không data", 4]];
const fEl = document.getElementById("filters");
FBTN.forEach(([label, v]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "fbtn";
  b.textContent = v < 0 ? `${label} ${D.streets.length}` : `${label} ${COUNTS[v]}`;
  b.setAttribute("aria-pressed", String(v === filter));
  b.onclick = () => {
    filter = v;
    [...fEl.children].forEach((c, i) => c.setAttribute("aria-pressed", String(FBTN[i][1] === v)));
    renderList();
  };
  fEl.appendChild(b);
});

/* ---------- wiring ---------- */
let qt = 0;
qEl.addEventListener("input", () => {
  clearTimeout(qt);
  qt = setTimeout(() => { query = qEl.value; renderList(); }, 110);
});
qEl.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = FOLD(qEl.value.trim());
  if (/^\d{4,}$/.test(q)) {
    const wi = WAYS.findIndex(w => String(w.id) === q);
    if (wi >= 0) {
      const owner = D.streets.find(s => s.w.includes(wi));
      if (owner) select(owner.n, false);
      map.fitBounds(L.latLngBounds(WAYS[wi].pts), { padding: [70, 70], maxZoom: 18 });
      const ln = lineOf.get(wi); if (ln) ln.openPopup();
      syncWayRow(wi);
      return;
    }
  }
  const first = visible()[0];
  if (first) select(first.n, true);
});
pickEl.addEventListener("change", () => { if (pickEl.value) select(pickEl.value, true); });

document.getElementById("stat").innerHTML =
  `<span><b>${WAYS.length.toLocaleString("vi-VN")}</b> way có tên</span>` +
  `<span><b>${D.streets.length}</b> đường</span>`;

renderList();
select("Phúc Diễn", true);
})();
</script>
</body>
</html>
